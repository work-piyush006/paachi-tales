{% extends 'base.html' %}{% block content %}<section class="container page"><h1>{{ collection.name if collection else 'Collection' }}</h1><div class="grid-3">{% for p in products %}<article class="card product-card"><a href="{{ url_for('web.product_detail', slug=p.slug) }}"><img loading="lazy" src="{{ p.thumbnail_url or p.hero_image_url or '/static/media/fallback.webp' }}"></a><h3>{{ p.title or p.name }}</h3><p>{{ p.description[:90] if p.description else '' }}</p><div class="card-actions"><button data-share="{{ request.url_root[:-1] + url_for('web.product_detail', slug=p.slug) }}">⤴</button><button data-wishlist="{{ p.slug }}">♡</button><a class="btn" target="_blank" href="https://wa.me/?text={{ ('Hello, I want price for ' ~ (p.title or p.name) ~ ' (' ~ (p.product_code or 'N/A') ~ ')')|urlencode }}">Know Price</a></div></article>{% endfor %}</div></section>{% endblock %}
