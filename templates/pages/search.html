{% extends 'base.html' %}{% block content %}<section class="container page"><h1>Search Results</h1><p>Query: {{ query }}</p><div class="grid-3">{% for p in products %}<a class="card" href="{{ url_for('web.product_detail', slug=p.slug) }}"><img loading="lazy" src="{{ p.thumbnail_url or p.hero_image_url or '/static/media/fallback.webp' }}"><h3>{{ p.title or p.name }}</h3></a>{% else %}<div class="card">No results found for “{{query}}”. Try necklace, kundan, earrings, bridal, festive.</div>{% endfor %}</div></section>{% endblock %}
