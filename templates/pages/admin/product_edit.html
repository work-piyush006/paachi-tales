{% extends 'base.html' %}{% block content %}<section class="container page"><h1>Edit Product</h1><form class="card" method="post" action="{{ url_for('admin.product_save') }}" enctype="multipart/form-data"><input type="hidden" name="id" value="{{product.id}}"><input name="title" value="{{product.title or product.name}}" required><input name="slug" value="{{product.slug}}" required><input name="product_code" value="{{product.product_code}}" required><input name="category" value="{{product.category or ''}}"><textarea name="description">{{product.description or ''}}</textarea><select name="catalogue_id">{% for c in catalogues %}<option value="{{c.id}}" {% if c.id==product.catalogue_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select><label>Replace Images<input type="file" name="images" multiple accept="image/*"></label><label>Replace Videos<input type="file" name="videos" multiple accept="video/*"></label><textarea name="image_urls" placeholder="Image URLs (one per line)"></textarea><textarea name="video_urls" placeholder="Video URLs (one per line)"></textarea><button class="btn">Update Product</button></form></section>{% endblock %}
