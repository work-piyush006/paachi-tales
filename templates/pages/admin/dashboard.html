{% extends 'base.html' %}{% block content %}<section class="container page"><h1>Admin Dashboard</h1><div class="admin-grid"><form class="card" method="post" action="{{ url_for('admin.product_save') }}" enctype="multipart/form-data"><h3>Add Product</h3><input name="title" placeholder="Title" required><input name="slug" placeholder="slug" required><input name="product_code" placeholder="Code" required><input name="category" placeholder="Category"><textarea name="description" placeholder="Description"></textarea><select name="catalogue_id">{% for c in catalogues %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><label>Images (1-10)<input type="file" name="images" multiple accept="image/*"></label><label>Videos (1-3)<input type="file" name="videos" multiple accept="video/*"></label><button class="btn">Save Product</button></form><form class="card" method="post" action="{{ url_for('admin.catalogue_save') }}"><h3>Add Catalogue</h3><input name="name" placeholder="Name" required><input name="slug" placeholder="slug" required><textarea name="description" placeholder="Description"></textarea><input name="cover_image_url" placeholder="Cover URL"><button class="btn">Save Catalogue</button></form></div><h2>Products</h2><div class="grid-3">{% for p in products %}<article class="card"><h3>{{p.title or p.name}}</h3><p>{{p.product_code}}</p><form method="post" action="{{ url_for('admin.product_delete', product_id=p.id) }}"><button>Delete</button></form></article>{% endfor %}</div></section>{% endblock %}
